<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Avgångar – Stockholm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/D-DIN.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="fonts/D-DIN-Bold.otf" as="font" type="font/otf" crossorigin>
<style>
/* D-DIN (SIL Open Font License 1.1, see fonts/D-DIN-OFL.txt), an open version of the DIN 1451 sign typeface. */
@font-face { font-family: "D-DIN"; src: url(fonts/D-DIN.otf) format("opentype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "D-DIN"; src: url(fonts/D-DIN-Bold.otf) format("opentype"); font-weight: 700; font-display: swap; }
:root {
  --u: 64px;       /* base unit from the viewport: header, footer, margins */
  --row-h: 64px;   /* type scale of the departure rows */
  --slot: 64px;    /* height of one row, stretched so the rows fill the board */
  --bg: #000;
  --amber: #ffb000;
  --amber-dim: #b98200;
  --white: #f4f4f4;
  --grey: #8d8d8d;
  --line: #2a2a2a;
  --red: #ff4d3d;
  /* D-DIN is hosted with the page so every device uses the same font; screens without Helvetica or
     Arial otherwise fall back to their own sans-serif with other letter widths. */
  --sans: "D-DIN", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --sign: var(--sans);
}
body.led { --sign: "Doto", var(--sans); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--amber); font-family: var(--sans); }
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
body.scroll { height: auto; min-height: 100dvh; overflow: auto; }
body.idle { cursor: none; }

/* Header */
#hd { display: flex; align-items: center; justify-content: space-between; gap: 1em;
  padding: calc(var(--u) * .2) calc(var(--u) * .5); border-bottom: 2px solid var(--line); flex: none; }
.ttl { display: flex; align-items: baseline; gap: .5em; min-width: 0; font-size: calc(var(--u) * .5); }
#ttl { color: var(--white); font-weight: 700; }
#loc { color: #a8a8a8; font-size: .75em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#clock { font-family: var(--sign); font-weight: 800; font-size: calc(var(--u) * .66); line-height: 1; white-space: nowrap;
  font-variant-numeric: tabular-nums; }

/* Board */
#board { flex: 1 1 auto; min-height: 0; display: grid; gap: 0 calc(var(--u) * .6);
  padding: 0 calc(var(--u) * .5); overflow: hidden; align-content: start; }
.col { min-width: 0; }
.sec, .row { height: var(--slot); display: flex; align-items: center; gap: calc(var(--row-h) * .22); }
.sec { color: var(--white); font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  font-size: calc(var(--row-h) * .34); border-bottom: 2px solid #4a4a4a; padding-top: calc(var(--row-h) * .2); }
.sec svg { width: calc(var(--row-h) * .5); height: calc(var(--row-h) * .5); flex: none; --ic-cut: var(--bg); }
.sec .sn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A direction section shows its direction on a second line under the name. */
.sec .st { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.sec .sd { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--grey);
  font-weight: 400; text-transform: none; letter-spacing: 0; font-size: .85em; }
.sec .sw { flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: .15em; color: var(--grey);
  font-weight: 400; text-transform: none; letter-spacing: 0; font-size: .85em; }
.sec .sw svg { width: .9em; height: .9em; }
.sec small { flex: none; color: var(--grey); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: .8em; }
.row { border-bottom: 1px solid var(--line); }
.badge { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: .22em;
  min-width: calc(var(--row-h) * 1.4); height: calc(var(--row-h) * .64); padding: 0 .4em; border-radius: calc(var(--row-h) * .1);
  background: var(--c); color: #fff; font-weight: 700; font-size: calc(var(--row-h) * .36);
  font-variant-numeric: tabular-nums; --ic-cut: var(--c); }
.badge svg { width: .95em; height: .95em; flex: none; }
.mid { flex: 1 1 auto; min-width: 0; }
.dest { font-family: var(--sign); font-weight: 800; font-size: calc(var(--row-h) * .45); line-height: 1.1;
  white-space: nowrap; overflow: hidden; }
.dest > span { display: inline-block; }
/* Set by fitDests: a smaller size only when the name does not fit, and as a last resort a slow scroll. */
.dest.long { font-size: calc(var(--row-h) * .38); }
.dest.xlong { font-size: calc(var(--row-h) * .32); }
.dest.marq { -webkit-mask-image: linear-gradient(90deg, transparent, #000 .3em, #000 calc(100% - .3em), transparent);
  mask-image: linear-gradient(90deg, transparent, #000 .3em, #000 calc(100% - .3em), transparent); }
.dest.marq > span { animation: marq var(--dur) ease-in-out var(--delay) infinite alternate; }
@keyframes marq { 0%, 20% { transform: none; } 80%, 100% { transform: translateX(calc(-1 * var(--shift))); } }
@media (prefers-reduced-motion: reduce) { .dest.marq > span { animation: none; } }
.from { color: #a8a8a8; font-size: calc(var(--row-h) * .285); line-height: 1.2;
  display: flex; gap: .5em; white-space: nowrap; }
.from .fs { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.from .fw { flex: none; display: inline-flex; align-items: center; gap: .15em; }
.from .fw svg { width: .95em; height: .95em; }
.from .cx { color: var(--red); }
.times { flex: none; text-align: right; font-family: var(--sign); font-weight: 800; white-space: nowrap;
  font-variant-numeric: tabular-nums; }
.t1 { font-size: calc(var(--row-h) * .45); line-height: 1.1; }
.t1.cx { color: var(--red); }
.t2 { color: #d09400; font-size: calc(var(--row-h) * .3); line-height: 1.15; min-height: 1.15em; }
body.led .dest, body.led .times, body.led #clock { text-shadow: 0 0 .3em rgba(255, 176, 0, .4); }
body.led .t1.cx { text-shadow: 0 0 .3em rgba(255, 77, 61, .4); }
.empty { grid-column: 1 / -1; align-self: center; text-align: center; color: var(--grey);
  font-size: calc(var(--u) * .4); padding: 2em 1em; }
body:not(.scroll) #board:has(.empty) { align-content: center; }

/* Footer */
#ft { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 2em;
  padding: calc(var(--u) * .14) calc(var(--u) * .5); border-top: 2px solid var(--line);
  font-size: calc(var(--u) * .3); min-height: calc(var(--u) * .66); }
#msg { color: var(--amber); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status { color: var(--grey); white-space: nowrap; flex: none; }
#status.bad { color: var(--red); }

/* Controls */
.ctl { position: fixed; right: 14px; bottom: 14px; display: flex; gap: 8px; transition: opacity .4s; z-index: 5; }
body.idle .ctl { opacity: 0; pointer-events: none; }
.ctl button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #555; background: #1b1b1b; color: #eee;
  display: grid; place-items: center; cursor: pointer; padding: 0; }
.ctl button:hover { background: #333; }
.ctl svg { width: 22px; height: 22px; }

/* Settings panel */
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: #161616; color: #eee;
  border-left: 1px solid #333; z-index: 10; overflow-y: auto; padding: 20px 22px 28px; font-size: 15px; cursor: auto; }
#panel h2 { margin: 0 0 16px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
#panel h3 { margin: 22px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #9a9a9a; font-weight: 600; }
/* Filters for single lines and stops are for the few who need them, so they start closed. */
#dDirs { margin: 22px 0 0; }
#dDirs summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 4px 0 8px;
  font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #9a9a9a; font-weight: 600; }
#dDirs summary::-webkit-details-marker { display: none; }
#dDirs summary::before { content: ''; width: 0; height: 0; border: 5px solid transparent; border-left: 7px solid currentColor; border-right: 0;
  transition: transform .15s; }
#dDirs[open] summary::before { transform: rotate(90deg); }
#dDirs summary:hover { color: #ccc; }
#dirsState { color: var(--amber); text-transform: none; letter-spacing: 0; font-weight: 400; }
#panel label { display: block; }
#panel input[type=text], #panel input[type=number], #panel select {
  width: 100%; padding: 9px 10px; border-radius: 6px; border: 1px solid #444; background: #0c0c0c; color: #eee; font: inherit; }
#panel input[type=range] { width: 100%; accent-color: var(--amber); }
#panel input[type=checkbox], #panel input[type=radio] { accent-color: var(--amber); width: 17px; height: 17px; margin: 0; }
#panel .hint { color: #9a9a9a; font-size: 13px; margin-top: 6px; }
#panel .opt { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
#panel .opt.off { opacity: .45; cursor: default; }
#panel .opt svg { width: 22px; height: 22px; --ic-cut: #161616; }
#panel .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#panel .two label > span { display: block; font-size: 13px; color: #bbb; margin-bottom: 4px; }
#panel .inline { display: flex; gap: 18px; }
#fDirs .ld { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; border-top: 1px solid #262626; }
#fDirs .ld:first-child { border-top: 0; }
#fDirs .badge { --row-h: 34px; margin-top: 4px; }
#fDirs .ldo { min-width: 0; }
#fDirs .opt { padding: 4px 0; }
#fDirs .lds { display: flex; flex-wrap: wrap; gap: 0 14px; margin: -2px 0 4px 27px; }
#fDirs .lds label { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 13px; color: #bbb; cursor: pointer; }
#panel #fDirs .lds input { width: 14px; height: 14px; }
.btn { border: 1px solid #555; background: #262626; color: #eee; border-radius: 6px; padding: 9px 12px; font: inherit; cursor: pointer; }
.btn:hover { background: #363636; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #000; font-weight: 600; }
.btn.x { border: 0; background: none; font-size: 24px; line-height: 1; padding: 0 4px; }
#sug { list-style: none; margin: 6px 0 0; padding: 0; border: 1px solid #444; border-radius: 6px; overflow: hidden; }
#panel .credit { margin-top: 28px; padding-top: 14px; border-top: 1px solid #2c2c2c; color: #9a9a9a; font-size: 13px; }
#panel .credit a { color: #ccc; }
#panel .credit a:hover { color: var(--amber); }
#sug li { padding: 9px 10px; cursor: pointer; border-top: 1px solid #2c2c2c; }
#sug li:first-child { border-top: 0; }
#sug li:hover, #sug li.on { background: #2c2c2c; }
#sug small { color: #9a9a9a; }
.rowbtns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; margin-top: 26px; flex-wrap: wrap; }

@media (max-width: 699px) {
  #hd, #board, #ft { padding-left: calc(var(--u) * .25); padding-right: calc(var(--u) * .25); }
  .ttl { flex-direction: column; align-items: flex-start; gap: 0; font-size: calc(var(--u) * .42); }
  .dest.long { font-size: calc(var(--row-h) * .29); }
  .dest.xlong { font-size: calc(var(--row-h) * .26); }
  .badge { min-width: calc(var(--row-h) * 1.1); font-size: calc(var(--row-h) * .3); }
  .dest, .t1 { font-size: calc(var(--row-h) * .32); }
  .t2 { font-size: calc(var(--row-h) * .22); }
  #ft { flex-direction: column; align-items: flex-start; gap: .3em; }
  #msg { white-space: normal; }
}
</style>
</head>
<body class="led">
<header id="hd">
  <div class="ttl"><span id="ttl"></span><span id="loc"></span></div>
  <div id="clock"></div>
</header>
<main id="board"></main>
<footer id="ft"><div id="msg"></div><div id="status"></div></footer>

<div class="ctl">
  <button id="bFs" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="bSet" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</div>

<aside id="panel" hidden>
  <h2><span data-t="settings"></span><button class="btn x" id="bClose" type="button">×</button></h2>

  <h3 data-t="place"></h3>
  <input type="text" id="fPlace" autocomplete="off" spellcheck="false">
  <ul id="sug" hidden></ul>
  <div class="hint" id="placeNow"></div>
  <div class="rowbtns"><button class="btn" id="bGeo" type="button" data-t="useMyLocation"></button></div>
  <label class="opt" id="oFollow" style="margin-top:8px"><input type="checkbox" id="fFollow"> <span data-t="follow"></span></label>
  <div class="hint" id="followHint" style="margin:0 0 0 27px"></div>

  <h3><span data-t="radius"></span>: <span id="rVal"></span></h3>
  <input type="range" id="fR" min="100" max="2000" step="50">
  <div class="hint" id="rHint"></div>

  <h3 data-t="modes"></h3>
  <div id="fModes"></div>

  <details id="dDirs">
    <summary><span data-t="dirsTitle"></span><span id="dirsState"></span></summary>
    <div class="hint" data-t="dirsHint" style="margin:0 0 6px"></div>
    <div class="rowbtns" style="margin:0 0 8px"><button class="btn" id="bDirAll" type="button" data-t="dirsAll"></button><button class="btn" id="bDirNone" type="button" data-t="dirsNone"></button></div>
    <div class="hint" id="dirsMode" style="margin:0 0 6px"></div>
    <div id="fDirs"></div>
  </details>

  <h3 data-t="language"></h3>
  <div class="inline">
    <label class="opt"><input type="radio" name="lang" value="sv"> Svenska</label>
    <label class="opt"><input type="radio" name="lang" value="en"> English</label>
  </div>

  <h3 data-t="display"></h3>
  <div class="two">
    <label><span data-t="window"></span>
      <select id="fWin"><option value="30">30 min</option><option value="60">60 min</option><option value="90">90 min</option><option value="120">120 min</option></select></label>
    <label><span data-t="textSize"></span>
      <select id="fSize"><option value="a" data-t="sizeA"></option><option value="s" data-t="sizeS"></option><option value="m" data-t="sizeM"></option><option value="l" data-t="sizeL"></option><option value="x" data-t="sizeX"></option></select></label>
  </div>
  <label class="opt" style="margin-top:8px"><input type="checkbox" id="fWalk"> <span data-t="walkOpt"></span></label>
  <div class="hint" data-t="walkHint" style="margin:0 0 6px 27px"></div>
  <label class="opt"><input type="checkbox" id="fGroup"> <span data-t="groupOpt"></span></label>
  <div class="hint" data-t="groupHint" style="margin:0 0 6px 27px"></div>
  <label class="opt"><input type="checkbox" id="fSplit"> <span data-t="splitOpt"></span></label>
  <div class="hint" data-t="splitHint" style="margin:0 0 6px 27px"></div>
  <label class="opt"><input type="checkbox" id="fPlat"> <span data-t="platOpt"></span></label>
  <label class="opt"><input type="checkbox" id="fCx"> <span data-t="cxOpt"></span></label>
  <div class="hint" data-t="cxHint" style="margin:0 0 6px 27px"></div>
  <label class="opt"><input type="checkbox" id="fLed"> <span data-t="led"></span></label>
  <label class="opt"><input type="checkbox" id="fMsg"> <span data-t="showMsg"></span></label>

  <div class="actions">
    <button class="btn primary" id="bCopy" type="button" data-t="copyLink"></button>
    <button class="btn" id="bDone" type="button" data-t="done"></button>
  </div>
  <div class="hint" data-t="linkHint"></div>

  <footer class="credit"><span data-t="madeBy"></span> Daniel Eneström · <a href="https://github.com/danielenestrom/stockholm-transport-screen" target="_blank" rel="noopener" data-t="sourceCode"></a></footer>
</aside>

<script>
(() => {
'use strict';

const API = 'https://transport.integration.sl.se/v1';
const GEO = 'https://journeyplanner.integration.sl.se/v2/stop-finder';
const MODES = ['metro', 'train', 'tram', 'bus', 'boat'];
const SPLIT_MODES = ['metro', 'train'];   // split by direction when that setting is on
const BIT = { metro: 1, train: 2, tram: 4, bus: 8, boat: 16 };
const AREA_BITS = { METROSTN: 1, RAILWSTN: 2 | 4, TRAMSTN: 4, BUSTERM: 8, SHIPBER: 16, FERRYBER: 16 };
const API_MODE = { METRO: 'metro', TRAIN: 'train', TRAM: 'tram', BUS: 'bus', SHIP: 'boat', FERRY: 'boat' };
const MAX_SITES = 12;        // stops with departures queried per refresh
const WALK_M_PER_MIN = 75;   // straight-line metres covered per minute of walking
const REFRESH_MS = 30000;   // shortest refresh interval; grows with the number of stops
const IDLE_POLL_MS = 5 * 60000;   // stops with nothing to show are asked less often
const SITES_TTL = 24 * 3600 * 1000;
const DEFAULTS = { lat: 59.3312, lon: 18.0592, name: 'T-Centralen', r: 500, hide: [], lang: 'sv',
                   win: 60, walk: true, size: 'a', led: true, msg: true, group: true, cx: false, plat: true, split: true, dirmode: 'hide', dirs: [] };

/* Line colours. Metro and commuter train follow the colours used on SL maps. */
const COL = {
  red: '#dc0d15', green: '#04a64b', blue: '#008dd0', train: '#ff49a5',
  tvar: '#d77d00', nockeby: '#778da7', lidingo: '#b76020', city: '#747770',
  roslag: '#9f599a', saltsjo: '#21b6ba', boat: '#00637c'
};
function lineColor(d) {
  const g = d.group.toLowerCase(), n = d.line;
  if (d.mode === 'metro') return /röd/.test(g) || /^1[34]/.test(n) ? COL.red : /grön/.test(g) || /^1[789]/.test(n) ? COL.green : COL.blue;
  if (d.mode === 'train') return COL.train;
  if (d.mode === 'tram') return /tvär/.test(g) ? COL.tvar : /nockeby/.test(g) ? COL.nockeby : /liding/.test(g) ? COL.lidingo
    : /roslag/.test(g) ? COL.roslag : /saltsj/.test(g) ? COL.saltsjo : COL.city;
  if (d.mode === 'bus') return /blå/.test(g) ? COL.blue : COL.red;
  return COL.boat;
}

const ICON = {
  metro: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M6 6.4h12v3.2h-4.3V18h-3.4V9.600H6z" fill="var(--ic-cut,#000)"/></svg>',
  train: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M9 1.500h6a3.500 3.500 0 0 1 3.500 3.500v10a3.500 3.500 0 0 1-2.700 3.400L18 22.500h-2.500l-1.400-3.500H9.900L8.500 22.500H6l2.200-4.100A3.500 3.500 0 0 1 5.500 15V5A3.500 3.500 0 0 1 9 1.500zM8 5.500V11h3.300V5.500zM12.700 5.500V11H16V5.500zM9 13.200a1.300 1.300 0 1 0 0 2.600 1.300 1.300 0 0 0 0-2.600zM15 13.200a1.300 1.300 0 1 0 0 2.600 1.300 1.300 0 0 0 0-2.600z"/></svg>',

      const k = i++, url = API + '/sites/' + list[k].id + '/departures?forecast=' + cfg.win;
      if ((pollAfter.get(list[k].id) || 0) > Date.now()) continue;   // nothing to show there: asked less often

  const active = cfg.dirmode === 'show' || cfg.dirs.length > 0;
  $('dirsState').textContent = active ? t('dirsActive') : '';
  $('dirsMode').textContent = cfg.dirmode === 'show' ? t('dirsOnly') : '';
  if (!$('dDirs').open) return;   // the list is only built while the section is open
  const lines = new Map();
  const entry = (mode, line, group) => {
    let e = [...lines.values()].find(x => x.line === line && (!mode || !x.mode || x.mode === mode));
    if (!e) lines.set(MODES.indexOf(mode) + '|' + line, e = { mode, line, group, dirs: new Map() });
    if (mode && !e.mode) Object.assign(e, { mode, group });
    return e;
  };
  const dir = (e, code) => {
    if (!e.dirs.has(code)) e.dirs.set(code, { dests: new Set(), stops: new Map() });
    return e.dirs.get(code);
  };
  const stop = (d, name, id, dist) => {
    if (!d.stops.has(name)) d.stops.set(name, { ids: new Set(), dist });
    const st = d.stops.get(name);
    st.ids.add(id); st.dist = Math.min(st.dist, dist);
  };
  for (const site of near) for (const d of depsBySite.get(site.id) || []) {
    if (cfg.hide.includes(d.mode) || !(d.dirCode === 1 || d.dirCode === 2)) continue;
    const di = dir(entry(d.mode, d.line, d.group), d.dirCode);
    if (d.dest) di.dests.add(d.dest);   // where the trips go, not SL's direction name for the line
    stop(di, site.name, site.id, site.dist);
  }
  for (const k of cfg.dirs) {
    const m = /^(.+):([12])(?:@(\d+))?$/.exec(k);
    if (!m) continue;
    const di = dir(entry('', m[1], ''), +m[2]);
    if (m[3] && ![...di.stops.values()].some(st => st.ids.has(+m[3]))) stop(di, siteName(+m[3]), +m[3], Infinity);
  }
  dirCatalog = [...lines.entries()].sort((a, b) => a[0].localeCompare(b[0], 'sv', { numeric: true })).map(x => x[1]);
  const html = dirCatalog.map(e => '<div class="ld"><span class="badge" style="--c:' + (e.mode ? lineColor(e) : '#555') + '">' +
    (e.mode ? ICON[e.mode] : '') + '<b>' + esc(e.line) + '</b></span><div class="ldo">' +
    [...e.dirs.keys()].sort().map(code => {
      const di = e.dirs.get(code), names = [...di.dests].sort((a, b) => a.localeCompare(b, 'sv'));
      const stops = [...di.stops.entries()].sort((a, b) => a[1].dist - b[1].dist || a[0].localeCompare(b[0], 'sv'));
      const attrs = ' data-l="' + esc(e.line) + '" data-c="' + code + '"';
      const one = stops.length === 1 ? ' data-one="' + [...stops[0][1].ids].join(' ') + '"' : '';
      return '<div class="ldd"><label class="opt"><input type="checkbox"' + attrs + one + '> ' +
        esc(names.length ? t('towards') + ' ' + names.join(', ') : t('dirN', { n: code })) + '</label>' +
        (stops.length > 1 ? '<div class="lds">' + stops.map(([name, st]) =>
          '<label><input type="checkbox"' + attrs + ' data-s="' + [...st.ids].join(' ') + '">' + esc(name) + '</label>').join('') + '</div>' : '') +
        '</div>';
    }).join('') + '</div></div>').join('');
  if (html !== lastDirsHtml) { $('fDirs').innerHTML = html; lastDirsHtml = html; }
  const set = new Set(cfg.dirs);
  for (const box of $('fDirs').querySelectorAll('.ldd')) {
    const main = box.querySelector('.opt input'), l = main.dataset.l, c = main.dataset.c;
    const subs = [...box.querySelectorAll('.lds input')];
    for (const el of subs) el.checked = el.dataset.s.split(' ').every(id => dirShown(set, l, c, +id));
    const on = subs.filter(el => el.checked).length;
    main.checked = subs.length ? on === subs.length
      : main.dataset.one ? main.dataset.one.split(' ').every(id => dirShown(set, l, c, +id)) : dirShown(set, l, c, null);
    main.indeterminate = subs.length > 0 && on > 0 && on < subs.length;
  }
}
/* One checkbox changed. Entries mean "hidden" in hide mode and "shown" in show mode; a per-stop
   change on a direction that is listed for every stop splits that entry into one per other stop. */
function changeDir(el) {
  const set = new Set(cfg.dirs), g = el.dataset.l + ':' + el.dataset.c, listedMeansShown = cfg.dirmode === 'show';
  if (!el.dataset.s) {
    for (const k of [...set]) if (k === g || k.startsWith(g + '@')) set.delete(k);
    if (el.checked === listedMeansShown) set.add(g);
  } else {
    const ids = el.dataset.s.split(' '), listed = el.checked === listedMeansShown;
    if (set.has(g)) {
      if (!listed) {
        set.delete(g);
        const box = el.closest('.ldd');
        for (const other of box.querySelectorAll('.lds input')) if (other !== el)
          for (const id of other.dataset.s.split(' ')) set.add(g + '@' + id);
      }
    } else for (const id of ids) listed ? set.add(g + '@' + id) : set.delete(g + '@' + id);
  }
  update({ dirs: [...set] });
}
function syncPanelHints() {
  if (!sites) { $('rHint').textContent = ''; return; }
  findNear();
  $('rHint').textContent = nearTotal > MAX_SITES ? t('stopsCapped', { n: nearTotal, max: MAX_SITES }) : t('stopsIn', { n: nearTotal });
}
function openPanel(open) {
  $('panel').hidden = !open;
  if (open) { syncPanel(); $('fPlace').value = ''; hideSug(); }
}

/* Place search */
let sugItems = [], geoSeq = 0, geoTimer;
const parseCoords = q => {
  const m = /^\s*(-?\d{1,2}(?:[.,]\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:[.,]\d+)?)\s*$/.exec(q);
  if (!m) return null;
  const lat = +m[1].replace(',', '.'), lon = +m[2].replace(',', '.');
  return Math.abs(lat) <= 90 && Math.abs(lon) <= 180 ? { lat, lon, name: coordName(lat, lon) } : null;
};
async function geocode(q) {
  const data = await fetchJson(GEO + '?name_sf=' + encodeURIComponent(q) + '&type_sf=any&any_obj_filter_sf=46');
  return (data.locations || []).filter(l => Array.isArray(l.coord) && l.coord.length === 2)
    .map(l => ({ lat: +l.coord[0], lon: +l.coord[1], name: l.disassembledName || l.name, q: l.matchQuality || 0,
                 where: l.parent && l.parent.name && l.parent.name !== (l.disassembledName || l.name) ? l.parent.name : '' }))
    // Equal matches (the same street name in several municipalities): nearest to the current location first.
    .sort((a, b) => b.q - a.q || distance(cfg.lat, cfg.lon, a.lat, a.lon) - distance(cfg.lat, cfg.lon, b.lat, b.lon));
}
function hideSug() { $('sug').hidden = true; sugItems = []; }
function showSug(items, note) {
  sugItems = items;
  $('sug').innerHTML = items.length
    ? items.map((s, i) => '<li data-i="' + i + '">' + esc(s.name) + (s.where ? ' <small>' + esc(s.where) + '</small>' : '') + '</li>').join('')
    : '<li><small>' + esc(note || t('noHits')) + '</small></li>';
  $('sug').hidden = false;
}
async function searchPlace() {
  const q = $('fPlace').value.trim(), seq = ++geoSeq;
  const c = parseCoords(q);
  if (c) return showSug([c]);
  if (q.length < 3) return hideSug();
  try {
    const list = await geocode(q);
    if (seq === geoSeq) showSug(list.slice(0, 6));
  } catch (e) { if (seq === geoSeq) showSug([]); }
}
function pickPlace(s) {
  if (!s) return;
  $('fPlace').value = ''; hideSug();
  setFollow(false);   // a chosen place stays put
  update({ lat: s.lat, lon: s.lon, name: s.name });
}

/* Follow my location: a per-device choice, kept out of links so a shared link or a wall
   screen never starts tracking. The setting needs location access to have been given once on
   this device. Safari reports access as undecided after every reload even while it still
   allows it, so the page remembers that access was given and, with following on, simply asks
   for the position: Safari answers at once or shows its permission dialog again. */
const FOLLOW_KEY = 'stockholm-transport.follow';
const GEO_OK_KEY = 'stockholm-transport.geo-ok';
const FOLLOW_MIN_MS = 30000;    // focus, visibility and pageshow often fire together
const FOLLOW_MOVE_M = 75;       // smaller moves are GPS jitter
const FOLLOW_MAX_ACC_M = 1500;  // a fix this coarse would pick the wrong stops
let follow = false, geoOk = false, geoPerm = navigator.geolocation ? 'unknown' : 'unsupported';
let lastFollow = 0, followBusy = false;
try { follow = localStorage.getItem(FOLLOW_KEY) === '1'; geoOk = localStorage.getItem(GEO_OK_KEY) === '1'; } catch (e) {}
function setFollow(on) {
  follow = on;
  try { localStorage.setItem(FOLLOW_KEY, on ? '1' : '0'); } catch (e) {}
  syncFollow();
}
function geoGranted() {
  geoOk = true;
  try { localStorage.setItem(GEO_OK_KEY, '1'); } catch (e) {}
  if (geoPerm !== 'granted') { geoPerm = 'granted'; syncFollow(); }
}
const canFollow = () => geoPerm === 'granted' || (geoOk && geoPerm !== 'denied' && geoPerm !== 'unsupported');
function syncFollow() {
  $('fFollow').disabled = !canFollow();
  $('fFollow').checked = follow && canFollow();
  $('oFollow').classList.toggle('off', !canFollow());
  $('followHint').textContent = geoPerm === 'unsupported' ? t('followNoGeo') : canFollow() ? t('followOn') : t('followNeedsGeo');
}
async function watchPermission() {
  if (!navigator.geolocation || !navigator.permissions || !navigator.permissions.query) return;
  try {
    const st = await navigator.permissions.query({ name: 'geolocation' });
    const apply = () => { geoPerm = st.state; syncFollow(); followNow(); };
    st.addEventListener('change', apply);
    apply();
  } catch (e) {}
}
// Declining the dialog turns following off, so the page does not ask every time it is opened.
function geoError(e) { if (e && e.code === 1) { geoPerm = 'denied'; setFollow(false); } }
function followNow(force) {
  if (!follow || !canFollow() || followBusy || document.visibilityState !== 'visible') return;
  if (!force && Date.now() - lastFollow < FOLLOW_MIN_MS) return;
  lastFollow = Date.now();
  followBusy = true;   // one request at a time, so an open dialog is not stacked with another
  navigator.geolocation.getCurrentPosition(p => {
    followBusy = false;
    geoGranted();
    const { latitude: lat, longitude: lon, accuracy } = p.coords;
    if (!follow || accuracy > FOLLOW_MAX_ACC_M) return;
    if (distance(cfg.lat, cfg.lon, lat, lon) < FOLLOW_MOVE_M && cfg.name === t('myLocation')) return;
    update({ lat, lon, name: t('myLocation') });
  }, e => { followBusy = false; geoError(e); }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 });
}

function buildPanel() {
  $('fModes').innerHTML = MODES.map(m =>
    '<label class="opt"><input type="checkbox" value="' + m + '">' + ICON[m] + '<span data-m="' + m + '"></span></label>').join('');
  $('fDirs').addEventListener('change', e => { if (e.target.matches('input')) changeDir(e.target); });
  $('bDirAll').addEventListener('click', () => update({ dirmode: 'hide', dirs: [] }));
  // The open or closed state is remembered on the device only; it does not change the board.
  try { $('dDirs').open = localStorage.getItem(STORE + '.dirsOpen') === '1'; } catch (e) {}
  $('dDirs').addEventListener('toggle', () => {
    try { localStorage.setItem(STORE + '.dirsOpen', $('dDirs').open ? '1' : '0'); } catch (e) {}
    syncDirs();
  });
  $('bDirNone').addEventListener('click', () => update({ dirmode: 'show', dirs: [] }));
  $('fModes').addEventListener('change', () => {
    update({ hide: [...$('fModes').querySelectorAll('input')].filter(el => !el.checked).map(el => el.value) });
  });
  $('fPlace').addEventListener('input', () => { clearTimeout(geoTimer); geoTimer = setTimeout(searchPlace, 300); });
  $('fPlace').addEventListener('keydown', e => { if (e.key === 'Enter' && sugItems.length) pickPlace(sugItems[0]); });
  $('sug').addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) pickPlace(sugItems[+li.dataset.i]); });
  $('bGeo').addEventListener('click', () => {
    if (!navigator.geolocation) { $('placeNow').textContent = t('geoFail'); return; }
    $('placeNow').textContent = t('locating');
    navigator.geolocation.getCurrentPosition(
      p => {
        geoGranted();
        lastFollow = Date.now();
        update({ lat: p.coords.latitude, lon: p.coords.longitude, name: t('myLocation') });
        setFollow(true);
      },
      e => { $('placeNow').textContent = t('geoFail'); geoError(e); },
      { enableHighAccuracy: true, timeout: 10000 });
  });
  $('fFollow').addEventListener('change', () => { setFollow($('fFollow').checked); followNow(true); });
  $('fR').addEventListener('input', () => update({ r: +$('fR').value }));
  $('fWin').addEventListener('change', () => update({ win: +$('fWin').value }));
  $('fWalk').addEventListener('change', () => update({ walk: $('fWalk').checked }));
  $('fSize').addEventListener('change', () => update({ size: $('fSize').value }));
  $('fLed').addEventListener('change', () => update({ led: $('fLed').checked }));
  $('fMsg').addEventListener('change', () => update({ msg: $('fMsg').checked }));
  $('fCx').addEventListener('change', () => update({ cx: $('fCx').checked }));
  $('fPlat').addEventListener('change', () => update({ plat: $('fPlat').checked }));
  $('fSplit').addEventListener('change', () => update({ split: $('fSplit').checked }));
  $('fGroup').addEventListener('change', () => update({ group: $('fGroup').checked }));
  document.querySelectorAll('input[name=lang]').forEach(el => el.addEventListener('change', () => update({ lang: el.value })));
  $('bCopy').addEventListener('click', async () => {
    persist();
    try { await navigator.clipboard.writeText(location.href); $('bCopy').textContent = t('copied'); }
    catch (e) { prompt(t('copyLink'), location.href); }
    setTimeout(() => { $('bCopy').textContent = t('copyLink'); }, 2000);
  });
  $('bDone').addEventListener('click', () => openPanel(false));
  $('bClose').addEventListener('click', () => openPanel(false));
  $('bSet').addEventListener('click', () => openPanel($('panel').hidden));
  $('bFs').addEventListener('click', toggleFullscreen);
}
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}

/* ---------- Kiosk behaviour ---------- */
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if ($('panel').hidden) document.body.classList.add('idle'); }, 4000);
}
async function keepAwake() {
  try { if (navigator.wakeLock && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) {}
}

/* ---------- Start ---------- */
async function start() {
  const init = initialConfig();
  cfg = init.cfg;
  buildPanel();
  applyStatic();
  render();
  if (init.addr) {   // a link may carry an address instead of coordinates
    try { const hit = (await geocode(init.addr))[0]; if (hit) cfg = sanitize({ ...cfg, lat: hit.lat, lon: hit.lon, name: hit.name }); } catch (e) {}
    applyStatic();
  }
  if (readHash()) history.replaceState(null, '', hashFor(cfg));
  if (init.first) openPanel(true);   // nothing chosen yet: ask for a location
  if (init.elsewhere) setFollow(false);
  refresh();
  watchPermission().then(() => followNow());   // also runs where the Permissions API is missing
  setInterval(render, 1000);
  addEventListener('resize', render);
  addEventListener('hashchange', () => {
    const h = readHash();
    if (!h) return;
    if (h.addr || (h.lat != null && distance(h.lat, h.lon, cfg.lat, cfg.lon) >= 50)) setFollow(false);
    const apply = loc => update({ ...DEFAULTS, lat: cfg.lat, lon: cfg.lon, name: cfg.name, ...h, ...loc }, { save: false });
    if (h.addr) geocode(h.addr).then(r => apply(r[0] ? { lat: r[0].lat, lon: r[0].lon, name: r[0].name } : {}), () => apply({}));
    else apply({});
  });
  addEventListener('keydown', e => {
    if (e.target.matches && e.target.matches('input, select, textarea')) { if (e.key === 'Escape') openPanel(false); return; }
    if (e.key === 'Escape') openPanel(false);
    else if (e.key === 's' || e.key === 'S') openPanel($('panel').hidden);
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });
  ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));
  wake();
  keepAwake();
  // Names are measured in the sign typeface, so measure again once a font has loaded.
  if (document.fonts) { document.fonts.addEventListener('loadingdone', () => { fontsDone++; render(); }); document.fonts.ready.then(() => { fontsDone++; render(); }); }
  document.addEventListener('visibilitychange', () => { keepAwake(); if (document.visibilityState === 'visible') { refresh(); followNow(); } });
  addEventListener('pageshow', e => { if (e.persisted) { refresh(); followNow(); } });   // restored from the back/forward cache
  addEventListener('focus', () => followNow());   // a laptop window that stayed visible behind another one
}
start();
})();
</script>
</body>
</html>
